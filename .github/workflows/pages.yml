name: Publicar site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar a aplicação
        run: dotnet publish Portfolio/Portfolio.csproj -c Release -o publicado

      - name: Gerar as páginas em HTML
        env:
          PATH_BASE: /${{ github.event.repository.name }}
        run: |
          cd publicado
          ASPNETCORE_URLS=http://localhost:5000 PathBase="$PATH_BASE" dotnet Portfolio.dll &
          cd ..

          for slug in $(jq -r '.[].slug' Portfolio/Data/projetos.json); do
            baixar "/Projetos/$slug" "Projetos/$slug"
          done

          # baixa CSS/JS/imagens com hash que as páginas referenciam
          grep -rhoE "(href|src)=\"$PATH_BASE/[^\"#?]+\.[a-zA-Z0-9]+(\?[^\"#]*)?\"" _site --include=index.html \
              | sed -E 's/^(href|src)="//; s/"$//' | sort -u | while read -r url; do
              caminho="${url#$PATH_BASE/}"; caminho="${caminho%%\?*}"
              mkdir -p "_site/$(dirname "$caminho")"
              curl -fsS "http://localhost:5000$url" -o "_site/$caminho" || echo "falhou: $url"
            done

          cp -r Portfolio/wwwroot/. _site/
          curl -fsS "http://localhost:5000$PATH_BASE/Portfolio.styles.css" -o _site/Portfolio.styles.css
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
